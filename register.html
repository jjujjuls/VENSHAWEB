<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — VENSHASKIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body class="portal-body">
    <header class="portal-header">
      <div class="container">
        <a class="portal-brand" href="/">VENSHA<span>SKIN</span></a>
        <nav class="portal-nav">
          <a href="/login.html">Sign in</a>
        </nav>
      </div>
    </header>

    <main class="portal-main">
      <div class="portal-card">
        <h1>Create account</h1>
        <p class="subtitle">Join VENSHASKIN for consultations, treatments, and equipment inquiries.</p>
        <form id="registerForm">
          <div class="portal-field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" required />
          </div>
          <div class="portal-field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" required />
          </div>
          <div class="portal-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" />
          </div>
          <div class="portal-field">
            <label for="phone">Mobile number</label>
            <input type="tel" id="phone" name="phone" placeholder="09921209631" />
          </div>
          <div class="portal-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />
          </div>
          <button class="portal-btn" type="submit">Create account</button>
          <p id="registerMsg" class="portal-msg"></p>
        </form>
        <p class="portal-footer-link">Already have an account? <a href="/login.html">Sign in</a></p>
      </div>
    </main>

    <script type="module">
      import { api, setToken, setUser, requireGuest, showMsg, localRegister } from './portal.js';

      requireGuest();

      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('registerMsg');
        const body = {
          firstName: document.getElementById('firstName').value.trim(),
          lastName: document.getElementById('lastName').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          password: document.getElementById('password').value,
        };

        try {
          showMsg(msg, 'Creating account…');
          let data;
          try {
            data = await api('/api/auth/register', { method: 'POST', body });
          } catch (err) {
            const fallback = err.isNetworkError || err.status === 501 || err.status === 404 || err.message.includes('Unsupported method');
            if (fallback) {
              data = localRegister(body);
            } else {
              throw err;
            }
          }
          setToken(data.token);
          setUser(data.user);
          window.location.href = '/account.html';
        } catch (err) {
          showMsg(msg, err.message, 'error');
        }
      });
    </script>
  </body>
</html>
