<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — VENSHASKIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body class="portal-body">
    <header class="portal-header">
      <div class="container">
        <a class="portal-brand" href="/">VENSHA<span>SKIN</span></a>
        <nav class="portal-nav">
          <a href="/register.html">Create account</a>
        </nav>
      </div>
    </header>

    <main class="portal-main">
      <div class="portal-card">
        <h1>Sign in</h1>
        <p class="subtitle">Access your account to book treatments or inquire about equipment.</p>
        <form id="loginForm">
          <div class="portal-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" />
          </div>
          <div class="portal-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" />
          </div>
          <button class="portal-btn" type="submit">Sign in</button>
          <p id="loginMsg" class="portal-msg"></p>
        </form>
        <p class="portal-footer-link">No account? <a href="/register.html">Register here</a></p>
      </div>
    </main>

    <script type="module">
      import { api, setToken, setUser, requireGuest, showMsg, localLogin } from './portal.js';

      requireGuest();

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('loginMsg');
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          showMsg(msg, 'Signing in…');
          let data;
          try {
            data = await api('/api/auth/login', { method: 'POST', body: { email, password } });
          } catch (err) {
            const fallback = err.isNetworkError || err.status === 501 || err.status === 404 || err.message.includes('Unsupported method');
            if (fallback) {
              data = localLogin({ email, password });
            } else {
              throw err;
            }
          }
          setToken(data.token);
          setUser(data.user);
          window.location.href = data.user.role === 'ADMIN' ? '/admin.html' : '/account.html';
        } catch (err) {
          showMsg(msg, err.message, 'error');
        }
      });
    </script>
  </body>
</html>
