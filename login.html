<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — VENSHASKIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: Inter, Arial, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; }
      .login-header { padding: 20px 32px; background: #fff; border-bottom: 1px solid #eee; }
      .login-header a { text-decoration: none; font-family: Georgia, serif; font-size: 22px; color: #111; letter-spacing: 1px; }
      .login-header a span { color: #B89B5E; }
      .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
      .login-card { background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.06); padding: 48px 40px; width: 100%; max-width: 420px; border: 1px solid rgba(184,155,94,.12); }
      .login-card h1 { font-family: Georgia, serif; font-size: 28px; font-weight: 500; color: #111; text-align: center; }
      .login-card .subtitle { text-align: center; color: #888; font-size: 14px; margin: 8px 0 28px; line-height: 1.5; }
      .login-field { margin-bottom: 20px; }
      .login-field label { display: block; font-size: 12px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
      .login-field input { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color .2s; outline: none; }
      .login-field input:focus { border-color: #B89B5E; box-shadow: 0 0 0 3px rgba(184,155,94,.08); }
      .login-btn { width: 100%; padding: 14px; background: #B89B5E; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; letter-spacing: .5px; cursor: pointer; transition: background .2s; }
      .login-btn:hover { background: #a88a4e; }
      .login-msg { margin-top: 16px; font-size: 13px; text-align: center; color: #666; }
      .login-msg.error { color: #d32f2f; }
      .login-msg.success { color: #2e7d32; }
    </style>
  </head>
  <body>
    <header class="login-header">
      <a href="/">VENSHA<span>SKIN</span></a>
    </header>
    <main class="login-main">
      <div class="login-card">
        <h1>Admin Sign In</h1>
        <p class="subtitle">Access the VENSHA SKIN administration panel.</p>
        <form id="loginForm">
          <div class="login-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" />
          </div>
          <div class="login-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" />
          </div>
          <button class="login-btn" type="submit">Sign in</button>
          <p id="loginMsg" class="login-msg"></p>
        </form>
      </div>
    </main>

    <script>
      (function() {
        const API = window.VENSHA_API || window.location.origin;

        async function api(path, opts) {
          const headers = { 'Accept': 'application/json', 'Content-Type': 'application/json' };
          const token = localStorage.getItem('vensha_token');
          if (token) headers.Authorization = 'Bearer ' + token;
          const res = await fetch(API + path, { ...opts, headers });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            const err = new Error(data.error || 'Login failed (' + res.status + ')');
            err.status = res.status;
            if (res.status === 0 || res.status === 501 || res.status === 404) err.isNetworkError = true;
            throw err;
          }
          return data;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const msg = document.getElementById('loginMsg');
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;

          msg.textContent = 'Signing in…';
          msg.className = 'login-msg';

          try {
            const data = await api('/api/auth/login', {
              method: 'POST',
              body: JSON.stringify({ email, password }),
            });
            localStorage.setItem('vensha_token', data.token);
            localStorage.setItem('vensha_user', JSON.stringify(data.user));
            window.location.href = '/admin.html';
          } catch (err) {
            msg.textContent = err.message;
            msg.className = 'login-msg error';
          }
        });

        /* Redirect to admin if already logged in */
        if (localStorage.getItem('vensha_token')) {
          window.location.replace('/admin.html');
        }
      })();
    </script>
  </body>
</html>
